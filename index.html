<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betly AI | Tactical Core</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <div class="menu-btn" onclick="toggleMenu()">
                <div class="menu-icon"></div>
            </div>
            <div class="logo-box">
                <h1>BETLY AI</h1>
                <div class="sidebar-identity">CURATED DAILY SELECTIONS</div>
            </div>
            <br>
            <a href="top_picks.html" class="quant-nav-widget">
                <div class="live-pulsator"></div>
                <div class="quant-nav-label">TOP PICKS</div>
                <div class="quant-nav-title">View High Value Selections</div>
            </a>
        </header>

        <div class="overlay" onclick="toggleMenu()"></div>
        <nav class="sidebar">
            <h3 style="color:white; margin-bottom: 30px; font-size: 1.2rem;">NAVIGATION</h3>
            <a href="#" class="nav-link active" onclick="switchView('tactical')">Tactical Core</a>
            <a href="top_picks.html" class="nav-link">Top Picks</a>
        </nav>

        <!-- View: Tactical Core (Main) -->
        <div id="view-tactical">
            <div class="search-container">
                <input type="text" id="global-search" placeholder="Search any team or league..."
                    oninput="handleSearch(this.value)">
                <div class="search-icon">🔍</div>
            </div>

            <nav class="tabs" id="league-tabs">
                <!-- Tabs injected via JS -->
            </nav>

            <main class="main-layout">
                <aside class="glass-card selector-box">
                    <h2>Match Fixtures</h2>
                    <div id="fixture-list">
                        <!-- Fixtures injected via JS -->
                        <div class="fixture-item loading-shimmer" style="height: 70px;"></div>
                        <div class="fixture-item loading-shimmer" style="height: 70px;"></div>
                        <div class="fixture-item loading-shimmer" style="height: 70px;"></div>
                    </div>
                </aside>

                <section id="results-display" class="results-area">
                    <div class="glass-card">
                        <div class="match-header" id="match-header">
                            <!-- Header injected via JS -->
                        </div>

                        <div class="score-box">
                            <div class="score-label">AI PREDICTED SCORE</div>
                            <div class="score-val" id="predicted-score-val">--</div>
                        </div>

                        <div class="picks-grid" id="picks-grid">
                            <!-- Picks injected via JS -->
                        </div>

                        <div id="analytics-summary"
                            style="margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px;">
                            <!-- Analytics injected via JS -->
                        </div>
                    </div>

                    <div id="h2h-history" style="display: none;">
                        <!-- H2H History injected via JS -->
                    </div>
                </section>
            </main>
        </div>


    </div>
</body>

</html>
